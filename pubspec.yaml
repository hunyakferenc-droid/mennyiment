name: mennyiment
description: "MennyiMent? – személyes Menti és tudatos szokáskövetés."
publish_to: 'none'

version: 2.5.0+37

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  file_picker: ^13.3.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.1

flutter:
  generate: true
  uses-material-design: true

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/roboto/Roboto-Italic.ttf
          weight: 400
          style: italic
    - family: MentiEmoji
      fonts:
        - asset: assets/fonts/menti_emoji/NotoColorEmoji.ttf

  assets:
    - assets/images/menti_complete/
    - assets/fonts/roboto/LICENSE.txt
    - assets/fonts/roboto/README.md
    - assets/fonts/roboto/SHA256SUMS
    - assets/fonts/menti_emoji/OFL.txt
    - assets/fonts/menti_emoji/README.md
    - assets/images/
    - assets/images/menti_outfits/

    - assets/images/menti_characters/
    - assets/images/menti_outfits_642/lany/

    - assets/images/menti_outfits_642/semleges/

    - assets/images/menti_2_2/accents/
    - assets/images/menti_2_2/accessories/
    - assets/images/menti_2_2/fitted/
    - assets/images/menti_2_2/ages/
    - assets/images/menti_2_2/auras/
    - assets/images/menti_2_2/backgrounds/
    - assets/images/menti_2_2/bases/
    - assets/images/menti_2_2/eyes/
    - assets/images/menti_2_2/faces/
    - assets/images/menti_2_2/families/
    - assets/images/menti_2_2/hair/
    - assets/images/menti_2_2/headwear/
    - assets/images/menti_2_2/outfits/
    - assets/images/menti_2_2/previews/
    - assets/images/menti_2_2/reactions/
    - assets/images/menti_2_2/styles/
    - assets/images/menti_2_2/core/
    - assets/images/menti_2_2/identities/

    - assets/images/menti_2_2/premium/
    - assets/images/menti_2_2/reference/
