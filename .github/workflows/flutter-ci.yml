name: Flutter CI

on:
  pull_request:
    branches: [main, feature/mennyiment-2-goal-reactions, feature/mennyiment-2-personal-hub, feature/mennyiment-2-2-avatar-system, feature/mennyiment-2-2-studio, feature/mennyiment-2-2-integration, feature/mennyiment-2-2-brand-visual-rework, feature/mennyiment-2-2-distinct-families, feature/mennyiment-2-2-concept-redesign]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze, test, web
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      DART_SUPPRESS_ANALYTICS: "true"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Flutter 3.47.7 (Dart 3.13.5)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
          pub-cache: true

      - name: Set up Java for debug Android builds
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK versions
        run: |
          flutter --version
          dart --version

      - name: flutter pub get and gen-l10n
        id: dependencies
        run: |
          flutter pub get
          flutter gen-l10n
          git diff --exit-code -- pubspec.lock

      - name: Whitespace check
        run: git diff --check HEAD^ HEAD

      - name: flutter analyze
        id: analyze
        run: flutter analyze

      - name: flutter test --concurrency=2
        id: test
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: flutter test --concurrency=2

      - name: Backup, restore and 6.8 regressions in Europe/Budapest (including DST)
        id: budapest
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          TZ: Europe/Budapest
        run: flutter test test/menti_family_system_test.dart test/menti_brand_rework_test.dart test/menti_identity_test.dart test/menti_visual_system_test.dart test/menti_identity_integration_test.dart test/daily_experience_test.dart test/experience_preferences_test.dart test/personal_hub_data_test.dart test/personal_hub_test.dart test/menti_completion_test.dart test/goal_reactions_test.dart test/personal_goal_store_test.dart test/menti_2_foundations_test.dart test/daily_menti_test.dart test/data_backup_test.dart test/data_restore_test.dart test/weekly_challenges_test.dart test/weekly_challenges_integration_test.dart test/daily_menti_evolution_integration_test.dart test/menti_evolution_rewards_test.dart --concurrency=2

      - name: flutter build web
        id: web
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: flutter build web --no-web-resources-cdn

      - name: Upload Chrome web build
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: mennyiment-2.2-web-${{ env.SOURCE_SHA }}
          path: build/web/
          if-no-files-found: error
          retention-days: 14

      - name: flutter build apk --debug
        id: apk
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: flutter build apk --debug

      - name: Verify debug APK signature and package
        id: verify_apk
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        run: |
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          APK_AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$APK_SIGNER" verify --verbose build/app/outputs/flutter-apk/app-debug.apk
          (
            cd build/app/outputs/flutter-apk
            sha256sum app-debug.apk > app-debug.apk.sha256
          )
          {
            printf 'source_commit=%s\n' "$SOURCE_SHA"
            "$APK_AAPT" dump badging build/app/outputs/flutter-apk/app-debug.apk
          } > build/app/outputs/flutter-apk/build-info.txt
          cat build/app/outputs/flutter-apk/build-info.txt

      - name: Upload installable debug APK
        if: ${{ !cancelled() && steps.apk.outcome == 'success' && steps.verify_apk.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: mennyiment-2.2-debug-apk-${{ env.SOURCE_SHA }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-debug.apk.sha256
            build/app/outputs/flutter-apk/build-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: CI summary
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          ANALYZE: ${{ steps.analyze.outcome }}
          TEST: ${{ steps.test.outcome }}
          BUDAPEST: ${{ steps.budapest.outcome }}
          WEB: ${{ steps.web.outcome }}
          APK: ${{ steps.apk.outcome }}
          APK_SIGNATURE: ${{ steps.verify_apk.outcome }}
        run: |
          {
            echo "## MennyiMent? Flutter CI"
            echo
            echo "Eredmény: $JOB_STATUS"
            echo
            echo "| Ellenőrzés | Állapot |"
            echo "| --- | --- |"
            echo "| flutter pub get + gen-l10n | $DEPENDENCIES |"
            echo "| flutter analyze | $ANALYZE |"
            echo "| flutter test --concurrency=2 | $TEST |"
            echo "| Europe/Budapest DST regressziók | $BUDAPEST |"
            echo "| flutter build web | $WEB |"
            echo "| flutter build apk --debug | $APK |"
            echo "| Android APK signature + package | $APK_SIGNATURE |"
            echo
            echo "Hibánál nyisd meg a piros lépés naplóját. A skipped lépés nem sikeres ellenőrzés."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$JOB_STATUS" = "failure" ]; then
            echo "::error title=Flutter CI sikertelen::Egy vagy több CI-lépés hibás. A részletek a piros lépés naplójában és a futás összefoglalójában láthatók."
          fi
