name: Downloadable Menti visual comparison

on:
  push:
    branches: [feature/mennyiment-2-4-visual-ux]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout actual evidence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify every image, matching viewport and application snapshot
        id: verify
        if: ${{ hashFiles('docs/images/menti-2.4-visual/comparison.json') != '' }}
        run: python3 tool/visual_240_gallery.py --check
      - name: Upload matched comparison and Hungarian handoff
        if: ${{ steps.verify.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: mennyiment-2.4.0-35-visual-evidence-${{ github.sha }}
          path: |
            docs/images/menti-2.4-visual/
            docs/visual-2.4/
            docs/2.4-visual-ux-hu.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
